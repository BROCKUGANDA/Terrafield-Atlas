name: Deploy to VPS

on:
  push:
    branches: [main, staging, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrafield-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run build
        env:
          DATABASE_URL: "file:./db/ci.db"
          NODE_ENV: production
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps
          chmod 600 ~/.ssh/vps
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Rsync to VPS
        run: |
          rsync -az --delete \
            --exclude='.git' --exclude='node_modules' --exclude='.next' \
            --exclude='.env' --exclude='db/*.db' --exclude='*.log' \
            -e "ssh -i ~/.ssh/vps -p ${{ secrets.VPS_PORT }}" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/ai-azimara-terrafield/"
      - name: Activate on VPS
        run: |
          ssh -i ~/.ssh/vps -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "set -e
             cd /home/ubuntu/ai-azimara-terrafield
             ~/.bun/bin/bun install --frozen-lockfile
             DATABASE_URL='file:/home/ubuntu/ai-azimara-terrafield/db/custom.db' ~/.bun/bin/bun run db:push
             DATABASE_URL='file:/home/ubuntu/ai-azimara-terrafield/db/custom.db' ~/.bun/bin/bun run build
             sudo systemctl restart terrafield.service"
      - name: Health gate
        run: |
          for i in $(seq 1 20); do
            CODE=$(curl -sk -o /dev/null -w '%{http_code}' https://terrafieldatlas.us/ || echo 000)
            echo "attempt $i -> $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "health gate failed"; exit 1
      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/vps
