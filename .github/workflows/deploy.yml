name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrafield-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build one production image
        run: |
          TAG="terrafield-atlas:${GITHUB_SHA}"
          docker build --build-arg NODE_ENV=production -t "$TAG" .
          docker save "$TAG" -o /tmp/terrafield-image.tar
          echo "$TAG" > /tmp/terrafield-image-tag
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps
          chmod 600 ~/.ssh/vps
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Copy release artifact
        run: |
          rsync -az --delete \
            --exclude='.git' --exclude='node_modules' --exclude='.next' \
            --exclude='.env' --exclude='db/*.db' --exclude='*.log' --exclude='download' \
            -e "ssh -i ~/.ssh/vps -p ${{ secrets.VPS_PORT }}" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/ai-azimara-terrafield/"
          rsync -az \
            -e "ssh -i ~/.ssh/vps -p ${{ secrets.VPS_PORT }}" \
            /tmp/terrafield-image.tar "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/terrafield-image.tar"
      - name: Backup, migrate, replace and gate readiness
        run: |
          ssh -i ~/.ssh/vps -p ${{ secrets.VPS_PORT }} \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "set -e; cd /home/ubuntu/ai-azimara-terrafield; chmod +x deploy/scripts/*.sh; ./deploy/scripts/release.sh /tmp/terrafield-image.tar $(cat /tmp/terrafield-image-tag)"
      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/vps
