name: Auto-promote dev -> staging -> main

on:
  push:
    branches: [dev, staging]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Promote dev to staging
        if: github.ref == 'refs/heads/dev'
        run: |
          git checkout staging
          git merge --ff-only origin/dev || git merge -X theirs origin/dev -m "chore: promote dev to staging"
          git push origin staging
      - name: Promote staging to main
        if: github.ref == 'refs/heads/staging'
        run: |
          git checkout main
          git merge --ff-only origin/staging || git merge -X theirs origin/staging -m "chore: promote staging to main"
          git push origin main
