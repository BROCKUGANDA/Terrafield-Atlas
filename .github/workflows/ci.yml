name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:./db/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run lint
      - run: bun test tests/
      - run: bun run build
        env:
          DATABASE_URL: "file:./db/ci.db"
          NODE_ENV: production
