services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: terrafield_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${TERRAFIELD_TEST_POSTGRES_PORT:-55434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d terrafield_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: "no"
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${TERRAFIELD_TEST_REDIS_PORT:-56380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: "no"
