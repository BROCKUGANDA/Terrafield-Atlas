name: terrafield-monitoring

# Host-side observability for the systemd deployment. Both UIs bind loopback
# only; reach them through an SSH tunnel. Prometheus scrapes the application on
# the host via host.docker.internal and never exposes the metrics port.

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: terrafield-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=0.0.0.0:9090

  grafana:
    image: grafana/grafana:11.6.0
    container_name: terrafield-grafana
    restart: unless-stopped
    depends_on: [prometheus]
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:3001
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/provisioning/dashboards/dashboard.json:/var/lib/grafana/dashboards/terrafield.json:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
