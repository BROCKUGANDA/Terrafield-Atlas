global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  # The app binds 127.0.0.1:3011; Prometheus runs with host networking.
  - job_name: terrafield-web
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["127.0.0.1:3011"]
        labels:
          service: terrafield-atlas
          deployment: host-systemd

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
