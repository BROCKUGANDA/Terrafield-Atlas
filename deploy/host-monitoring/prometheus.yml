global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  # The systemd web process listens on host port 3011; Caddy blocks public
  # access to /api/v1/metrics, but the container reaches it directly.
  - job_name: terrafield-web
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["host.docker.internal:3011"]
        labels:
          service: terrafield-atlas
          deployment: host-systemd

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
