global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: terrafield-web
    static_configs:
      - targets: ["web:3000", "web-secondary:3000"]
        labels:
          service: terrafield-atlas
    metrics_path: /api/v1/metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
