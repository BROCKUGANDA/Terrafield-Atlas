name: terrafield-atlas

x-app-image: &app-image terrafield-atlas:${IMAGE_TAG:-latest}

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-terrafield}?schema=public
  REDIS_URL: redis://redis:6379
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
  NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
  JOB_WORKER_MODE: external
  NEXT_TELEMETRY_DISABLED: "1"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-terrafield}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/10-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "test \"$(cat /proc/1/comm)\" = postgres && pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-terrafield}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "900", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  migrate:
    image: *app-image
    build: .
    command: ["sh", "-c", "bunx prisma migrate deploy && bun run db:seed"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [private]
    restart: "no"
    logging: *default-logging

  web:
    image: *app-image
    build: .
    command: ["bun", ".next/standalone/server.js"]
    environment:
      <<: *app-env
      WATCH_SCHEDULER_OFF: "1"
      READINESS_REQUIRE_WORKERS: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/api/v1/readyz'); if(!r.ok) process.exit(1)"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s
    networks: [edge, private]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"

  web-secondary:
    image: *app-image
    build: .
    command: ["bun", ".next/standalone/server.js"]
    environment:
      <<: *app-env
      WATCH_SCHEDULER_OFF: "1"
      READINESS_REQUIRE_WORKERS: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/api/v1/readyz'); if(!r.ok) process.exit(1)"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s
    networks: [edge, private]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"

  worker:
    image: *app-image
    build: .
    command: ["bun", "src/lib/jobs/worker.ts"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const {listWorkerHeartbeats,closeRuntimeRedis}=await import('./src/lib/jobs/runtime'); const workers=await listWorkerHeartbeats(); await closeRuntimeRedis(); if(!workers.some((worker)=>worker.ageSec<=90)) process.exit(1)"]
      interval: 15s
      timeout: 8s
      retries: 20
    networks: [private]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"

  scheduler:
    image: *app-image
    build: .
    command: ["bun", "src/lib/scheduler-worker.ts"]
    environment:
      <<: *app-env
      WATCH_SCHEDULER_OFF: "0"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [private]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  outbox:
    image: *app-image
    build: .
    command: ["bun", "src/lib/outbox-runtime.ts"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [private]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      web-secondary:
        condition: service_healthy
    networks: [edge]
    restart: unless-stopped
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    networks: [private]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/provisioning/dashboards/dashboard.json:/var/lib/grafana/dashboards/terrafield.json:ro
      - grafana-data:/var/lib/grafana
    networks: [private]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

networks:
  edge:
    driver: bridge
  private:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
