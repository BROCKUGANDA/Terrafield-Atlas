<?xml version="1.0" encoding="utf-8"?>
<!-- TerraField Atlas mission badge — flame over a field grid, satellite arc.
     Master vector twin of scripts/make-brand-assets.py (Pillow raster set). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TerraField Atlas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#091126"/>
      <stop offset="1" stop-color="#040814"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ffa62b"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="113" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="112" fill="none" stroke="#46608c" stroke-width="3"/>

  <!-- satellite pass arc + spacecraft -->
  <path d="M 72 118 A 200 132 0 0 1 440 118" fill="none" stroke="#9bb4d8" stroke-width="5" opacity="0.8"/>
  <circle cx="256" cy="40" r="11" fill="#e9f0fc"/>

  <!-- field grid (perspective rows + converging furrows) -->
  <g stroke="#35e0c8" stroke-width="4" opacity="0.82">
    <line x1="234" y1="358" x2="174" y2="478" opacity="0.55"/>
    <line x1="245" y1="358" x2="215" y2="478" opacity="0.62"/>
    <line x1="256" y1="358" x2="256" y2="478" opacity="0.66"/>
    <line x1="267" y1="358" x2="297" y2="478" opacity="0.62"/>
    <line x1="278" y1="358" x2="338" y2="478" opacity="0.55"/>
  </g>
  <g stroke="#35e0c8" stroke-linecap="round">
    <line x1="215" y1="366" x2="297" y2="366" stroke-width="4" opacity="0.5"/>
    <line x1="196" y1="394" x2="316" y2="394" stroke-width="5" opacity="0.68"/>
    <line x1="172" y1="426" x2="340" y2="426" stroke-width="6" opacity="0.85"/>
    <line x1="143" y1="466" x2="369" y2="466" stroke-width="7" opacity="1"/>
  </g>

  <!-- flame: outer, mid, core -->
  <path fill="url(#flame)"
        d="M 256 106
           C 300 168, 338 218, 338 282
           C 338 330, 302 356, 256 356
           C 210 356, 174 330, 174 282
           C 174 218, 212 168, 256 106 Z"/>
  <path fill="#ffa62b" opacity="0.95"
        d="M 256 176
           C 284 216, 306 250, 306 292
           C 306 322, 284 340, 256 340
           C 228 340, 206 322, 206 292
           C 206 250, 228 216, 256 176 Z"/>
  <path fill="#ffe9a8"
        d="M 256 234
           C 270 258, 282 278, 282 302
           C 282 322, 270 334, 256 334
           C 242 334, 230 322, 230 302
           C 230 278, 242 258, 256 234 Z"/>
</svg>
